# Deployment config lives in the public repo on purpose: the page's claim is that
# you can read what is running, and that includes how it is served.
#
# Only ./public is served. The repo's own files (README, LICENSE, this config)
# are deliberately outside the asset directory so they are not part of the site.

name = "verify"
compatibility_date = "2026-07-30"

# verify.plainreal.com is the only address this page has. People cite an evidence
# tool by URL, and preview builds of a half-finished verifier must not be publicly
# reachable and screenshottable.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
