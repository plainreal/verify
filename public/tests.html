<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlainReal verifier trust core — browser test suite</title>
<style>
  :root {
    --bg:#111119; --bg-card:#1C1C28; --border:rgba(255,255,255,0.11);
    --off:#F4F4F8; --sec:#ABABBE; --muted:#8B8BA3;
    --green:#0FD9A4; --red:#F26D6D; --amber:#FBBF24;
    --fm: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:24px; background:var(--bg); color:var(--off);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.5;
  }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  .env { color:var(--muted); font-size:12px; font-family:var(--fm); margin-bottom:20px;
         word-break:break-all; }
  #verdict { padding:16px 20px; border-radius:10px; font-size:20px; font-weight:600;
             margin-bottom:20px; border:1px solid var(--border); }
  #verdict.pass { background:rgba(15,217,164,0.10); color:var(--green); }
  #verdict.fail { background:rgba(239,68,68,0.10); color:var(--red); }
  #verdict.run  { background:rgba(251,191,36,0.10); color:var(--amber); }
  .suite { background:var(--bg-card); border:1px solid var(--border);
           border-radius:8px; padding:12px 16px; margin-bottom:8px;
           display:flex; justify-content:space-between; gap:16px; }
  .suite .n { font-weight:500; }
  .suite .c { font-family:var(--fm); font-size:13px; color:var(--sec); }
  .suite.bad { border-color:var(--red); }
  .suite.bad .c { color:var(--red); }
  pre { background:var(--bg-card); border:1px solid var(--red); border-radius:8px;
        padding:12px 16px; overflow-x:auto; font-family:var(--fm); font-size:12px;
        color:var(--red); white-space:pre-wrap; }
  .note { color:var(--muted); font-size:13px; margin-top:20px; }
</style>
</head>
<body>
<main>
  <h1>PlainReal verifier trust core — browser test suite</h1>
  <div class="env" id="env"></div>
  <div id="verdict" class="run">running…</div>
  <div id="suites"></div>
  <div id="failures"></div>
  <div class="note">
    Runs the same assertions as <code>verifier/test/run-node.mjs</code>.
    Open this file directly from disk (file://) with the network off — that is
    the environment the shipped verifier has to survive.
  </div>
</main>

<script>
/* ===== verifier/src/jcs.js ===== */
/*
 * JCS (RFC 8785) canonicalization for the browser.
 *
 * This is a port of core.CanonicalizeJSON (core/crypto.go). It must produce
 * byte-identical output to Go for every vector in testdata/jcs_vectors.json.
 * If it disagrees by one byte, the verifier page tells a buyer their genuine
 * record is invalid — so this file is gated in CI against the same
 * cross-language contract Go and Python already pass.
 *
 * Classic script on purpose: no `import`/`export`. Chromium blocks ES modules
 * on file://, and the page has to work from a copy saved to disk.
 *
 * WHY A HAND-WRITTEN PARSER INSTEAD OF JSON.parse
 * -----------------------------------------------
 * JSON.parse fails open on exactly the two inputs Go fails closed on:
 *
 *   1. Duplicate keys. JSON.parse silently keeps the last value, which would
 *      make the committed hash depend on an undocumented last-wins rule.
 *   2. Integers beyond +/-(2^53-1). JSON.parse rounds them without complaint;
 *      they cannot be canonicalized without precision loss.
 *
 * Accepting either would mean the browser reports a record as verifiable that
 * the substrate itself would reject. Fail closed, in lock-step with Go.
 */
(function (global) {
  "use strict";

  // Largest integer exactly representable as an IEEE-754 double (2^53 - 1).
  // Mirrors core.MaxSafeInteger.
  var MAX_SAFE_INTEGER = 9007199254740991;

  function JCSError(message) {
    var e = new Error(message);
    e.name = "JCSError";
    return e;
  }

  /* ---------------------------------------------------------------------
   * Parser
   *
   * Enforces the JSON grammar strictly, the way Go's json.Decoder does:
   * no leading '+', no leading zeros, no bare '.5' or '5.', no unescaped
   * control characters in strings, no trailing tokens after the top-level
   * value, and no NaN/Infinity literals.
   * ------------------------------------------------------------------ */

  function Parser(text) {
    this.s = text;
    this.i = 0;
  }

  Parser.prototype.error = function (msg) {
    return JCSError(msg + " at position " + this.i);
  };

  Parser.prototype.skipWhitespace = function () {
    // JSON permits exactly these four. Anything else is a token.
    while (this.i < this.s.length) {
      var c = this.s.charAt(this.i);
      if (c === " " || c === "\t" || c === "\n" || c === "\r") {
        this.i++;
      } else {
        break;
      }
    }
  };

  Parser.prototype.parseTopLevel = function () {
    this.skipWhitespace();
    var value = this.parseValue();
    this.skipWhitespace();
    if (this.i < this.s.length) {
      throw this.error("unexpected trailing token");
    }
    return value;
  };

  Parser.prototype.parseValue = function () {
    if (this.i >= this.s.length) {
      throw this.error("unexpected end of input");
    }
    var c = this.s.charAt(this.i);
    if (c === "{") return this.parseObject();
    if (c === "[") return this.parseArray();
    if (c === '"') return { t: "s", v: this.parseString() };
    if (c === "t") {
      this.expectLiteral("true");
      return { t: "b", v: true };
    }
    if (c === "f") {
      this.expectLiteral("false");
      return { t: "b", v: false };
    }
    if (c === "n") {
      this.expectLiteral("null");
      return { t: "z" };
    }
    if (c === "-" || (c >= "0" && c <= "9")) return this.parseNumber();
    throw this.error("unexpected character " + JSON.stringify(c));
  };

  Parser.prototype.expectLiteral = function (lit) {
    if (this.s.substr(this.i, lit.length) !== lit) {
      throw this.error("invalid literal, expected " + lit);
    }
    this.i += lit.length;
  };

  Parser.prototype.parseObject = function () {
    this.i++; // consume '{'
    // Insertion order is irrelevant to the output (keys are sorted before
    // serialization), but `seen` is what rejects duplicates.
    var keys = [];
    var values = {};
    var seen = Object.create(null);

    this.skipWhitespace();
    if (this.s.charAt(this.i) === "}") {
      this.i++;
      return { t: "o", keys: keys, values: values };
    }

    for (;;) {
      this.skipWhitespace();
      if (this.s.charAt(this.i) !== '"') {
        throw this.error("expected object key");
      }
      var key = this.parseString();
      if (seen[key] === true) {
        throw JCSError("duplicate object key " + JSON.stringify(key));
      }
      seen[key] = true;
      keys.push(key);

      this.skipWhitespace();
      if (this.s.charAt(this.i) !== ":") {
        throw this.error("expected ':' after object key");
      }
      this.i++;

      this.skipWhitespace();
      values[key] = this.parseValue();

      this.skipWhitespace();
      var c = this.s.charAt(this.i);
      if (c === ",") {
        this.i++;
        continue;
      }
      if (c === "}") {
        this.i++;
        return { t: "o", keys: keys, values: values };
      }
      throw this.error("expected ',' or '}' in object");
    }
  };

  Parser.prototype.parseArray = function () {
    this.i++; // consume '['
    var items = [];

    this.skipWhitespace();
    if (this.s.charAt(this.i) === "]") {
      this.i++;
      return { t: "a", v: items };
    }

    for (;;) {
      this.skipWhitespace();
      items.push(this.parseValue());

      this.skipWhitespace();
      var c = this.s.charAt(this.i);
      if (c === ",") {
        this.i++;
        continue;
      }
      if (c === "]") {
        this.i++;
        return { t: "a", v: items };
      }
      throw this.error("expected ',' or ']' in array");
    }
  };

  Parser.prototype.parseString = function () {
    this.i++; // consume opening '"'
    var out = "";

    for (;;) {
      if (this.i >= this.s.length) {
        throw this.error("unterminated string");
      }
      var c = this.s.charAt(this.i);

      if (c === '"') {
        this.i++;
        // Applies to keys as well as values -- keys are parsed through here,
        // and a lone surrogate in a key would otherwise change the sort.
        return replaceLoneSurrogates(out);
      }

      if (c === "\\") {
        this.i++;
        if (this.i >= this.s.length) {
          throw this.error("unterminated escape sequence");
        }
        var e = this.s.charAt(this.i);
        this.i++;
        if (e === '"') out += '"';
        else if (e === "\\") out += "\\";
        else if (e === "/") out += "/";
        else if (e === "b") out += "\b";
        else if (e === "f") out += "\f";
        else if (e === "n") out += "\n";
        else if (e === "r") out += "\r";
        else if (e === "t") out += "\t";
        else if (e === "u") {
          var hex = this.s.substr(this.i, 4);
          if (!/^[0-9a-fA-F]{4}$/.test(hex)) {
            throw this.error("invalid \\u escape");
          }
          this.i += 4;
          // Kept as a UTF-16 code unit. Surrogate pairs recombine naturally
          // because JS strings are themselves UTF-16.
          out += String.fromCharCode(parseInt(hex, 16));
        } else {
          throw this.error("invalid escape character " + JSON.stringify(e));
        }
        continue;
      }

      if (c < " ") {
        throw this.error("unescaped control character in string");
      }

      out += c;
      this.i++;
    }
  };

  Parser.prototype.parseNumber = function () {
    var start = this.i;

    if (this.s.charAt(this.i) === "-") this.i++;

    // Integer part: '0' alone, or [1-9] followed by digits. Leading zeros
    // are a grammar error, not a value to be normalized.
    if (this.s.charAt(this.i) === "0") {
      this.i++;
    } else if (this.s.charAt(this.i) >= "1" && this.s.charAt(this.i) <= "9") {
      while (this.s.charAt(this.i) >= "0" && this.s.charAt(this.i) <= "9") {
        this.i++;
      }
    } else {
      throw this.error("invalid number: expected digit");
    }

    // Fraction: a '.' must be followed by at least one digit.
    if (this.s.charAt(this.i) === ".") {
      this.i++;
      if (!(this.s.charAt(this.i) >= "0" && this.s.charAt(this.i) <= "9")) {
        throw this.error("invalid number: expected digit after '.'");
      }
      while (this.s.charAt(this.i) >= "0" && this.s.charAt(this.i) <= "9") {
        this.i++;
      }
    }

    // Exponent: 'e'/'E', optional sign, at least one digit.
    var c = this.s.charAt(this.i);
    if (c === "e" || c === "E") {
      this.i++;
      c = this.s.charAt(this.i);
      if (c === "+" || c === "-") this.i++;
      if (!(this.s.charAt(this.i) >= "0" && this.s.charAt(this.i) <= "9")) {
        throw this.error("invalid number: expected digit in exponent");
      }
      while (this.s.charAt(this.i) >= "0" && this.s.charAt(this.i) <= "9") {
        this.i++;
      }
    }

    var raw = this.s.slice(start, this.i);
    var f = Number(raw);

    if (!isFinite(f)) {
      // Overflow to +/-Infinity. Go's strconv.ParseFloat reports ErrRange here
      // and CanonicalizeJSON fails; so do we.
      throw JCSError("number " + raw + " is out of range for IEEE-754 double");
    }

    // Integer-valued numbers beyond the safe range cannot be canonicalized
    // without precision loss. Rejected in ANY spelling -- bare, exponent, or
    // with a zero fraction -- because the check is on the VALUE, not the text.
    if (f === Math.trunc(f) && Math.abs(f) > MAX_SAFE_INTEGER) {
      throw JCSError(
        "integer-valued number " + raw +
        " exceeds the safe range [-(2^53-1), 2^53-1]; represent large integers as JSON strings"
      );
    }

    return { t: "n", v: f };
  };

  // Replace unpaired UTF-16 surrogates with U+FFFD.
  //
  // Go strings are UTF-8, where a lone surrogate has no representation, so
  // Go's decoder substitutes U+FFFD. JS strings are UTF-16 and will happily
  // carry one. TextEncoder would substitute the same U+FFFD at encode time and
  // the bytes would agree by luck -- but "the hash matches because of how the
  // encoder happens to behave" is not something that should sit underneath a
  // signature check. Do it explicitly, so the canonical string and the
  // canonical bytes say the same thing and both match Go.
  function replaceLoneSurrogates(str) {
    var out = "";
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      if (code >= 0xd800 && code <= 0xdbff) {
        // High surrogate: valid only when followed by a low surrogate.
        var next = i + 1 < str.length ? str.charCodeAt(i + 1) : -1;
        if (next >= 0xdc00 && next <= 0xdfff) {
          out += str.charAt(i) + str.charAt(i + 1);
          i++;
        } else {
          out += "�";
        }
      } else if (code >= 0xdc00 && code <= 0xdfff) {
        // Low surrogate not preceded by a high one -- a valid pair would have
        // been consumed above.
        out += "�";
      } else {
        out += str.charAt(i);
      }
    }
    return out;
  }

  /* ---------------------------------------------------------------------
   * Serializer
   * ------------------------------------------------------------------ */

  // Mirrors writeCanonicalString: escape only '"', '\', and U+0000-U+001F.
  // Everything from U+0020 up is emitted raw and becomes UTF-8 at encode time.
  function canonicalString(str) {
    var out = '"';
    for (var i = 0; i < str.length; i++) {
      var c = str.charAt(i);
      var code = str.charCodeAt(i);
      if (code < 0x20) {
        if (c === "\b") out += "\\b";
        else if (c === "\t") out += "\\t";
        else if (c === "\n") out += "\\n";
        else if (c === "\f") out += "\\f";
        else if (c === "\r") out += "\\r";
        else {
          var hex = code.toString(16);
          while (hex.length < 4) hex = "0" + hex;
          out += "\\u" + hex; // lowercase, per RFC 8785
        }
      } else if (c === '"') {
        out += '\\"';
      } else if (c === "\\") {
        out += "\\\\";
      } else {
        out += c;
      }
    }
    return out + '"';
  }

  // RFC 8785 3.2.2.3 defers to ECMAScript Number::toString, which String() IS.
  // The four-case algorithm hand-written in the Go and Python ports is native
  // here. -0 serializes as "0" because String(-0) === "0".
  function canonicalNumber(f) {
    if (f === 0) return "0";
    return String(f);
  }

  function serialize(node, out) {
    switch (node.t) {
      case "z":
        out.push("null");
        return;
      case "b":
        out.push(node.v ? "true" : "false");
        return;
      case "s":
        out.push(canonicalString(node.v));
        return;
      case "n":
        out.push(canonicalNumber(node.v));
        return;
      case "a":
        out.push("[");
        for (var i = 0; i < node.v.length; i++) {
          if (i > 0) out.push(",");
          serialize(node.v[i], out);
        }
        out.push("]");
        return;
      case "o":
        // RFC 8785 sorts keys by UTF-16 code unit. JS strings are UTF-16 and
        // the default sort compares code units, so this matches Go's
        // compareUTF16Units exactly -- including non-BMP characters, where
        // surrogate pairs order differently from code points.
        var keys = node.keys.slice().sort();
        out.push("{");
        for (var j = 0; j < keys.length; j++) {
          if (j > 0) out.push(",");
          out.push(canonicalString(keys[j]));
          out.push(":");
          serialize(node.values[keys[j]], out);
        }
        out.push("}");
        return;
      default:
        throw JCSError("unsupported node type " + node.t);
    }
  }

  /* ---------------------------------------------------------------------
   * Public API
   * ------------------------------------------------------------------ */

  // canonicalize(jsonText) -> canonical JSON as a JS string.
  function canonicalize(jsonText) {
    if (typeof jsonText !== "string") {
      throw JCSError("canonicalize expects a JSON string");
    }
    var tree = new Parser(jsonText).parseTopLevel();
    var out = [];
    serialize(tree, out);
    return out.join("");
  }

  // canonicalizeToBytes(jsonText) -> Uint8Array of UTF-8 bytes.
  // This is what gets hashed; hashing the JS string directly would hash
  // UTF-16 code units and diverge from Go on every non-ASCII document.
  function canonicalizeToBytes(jsonText) {
    return new TextEncoder().encode(canonicalize(jsonText));
  }

  function toPlain(node) {
    switch (node.t) {
      case "z": return null;
      case "b": return node.v;
      case "s": return node.v;
      case "n": return node.v;
      case "a":
        var arr = [];
        for (var i = 0; i < node.v.length; i++) arr.push(toPlain(node.v[i]));
        return arr;
      case "o":
        var obj = {};
        for (var j = 0; j < node.keys.length; j++) {
          obj[node.keys[j]] = toPlain(node.values[node.keys[j]]);
        }
        return obj;
      default:
        throw JCSError("unsupported node type " + node.t);
    }
  }

  /**
   * readObject(jsonText) -> handle for a top-level JSON OBJECT.
   *
   * Exists so the verifier never needs JSON.parse. Reaching for JSON.parse to
   * pull out signing_attestation would reintroduce, in the one place it matters
   * most, the two fail-open behaviours this parser exists to close: duplicate
   * keys resolved last-wins, and integers past 2^53-1 rounded in silence. One
   * strict parse produces both the canonical bytes AND the field reads.
   *
   * Throws JCSError if the document is not a JSON object at the top level.
   */
  function readObject(jsonText) {
    if (typeof jsonText !== "string") {
      throw JCSError("readObject expects a JSON string");
    }
    var tree = new Parser(jsonText).parseTopLevel();
    if (tree.t !== "o") {
      throw JCSError("top-level value is not a JSON object");
    }

    return {
      keys: tree.keys.slice(),

      has: function (key) {
        return tree.keys.indexOf(key) !== -1;
      },

      // Returns the string value of a top-level key, or null if the key is
      // absent OR present with a non-string value. Callers distinguish the two
      // with has() when it matters.
      getString: function (key) {
        var node = tree.values[key];
        return node && node.t === "s" ? node.v : null;
      },

      // The document as plain JS values, built from the STRICT parse. Callers
      // that need to read nested fields or diff two documents use this instead
      // of JSON.parse, so a duplicate key or an unsafe integer is still a hard
      // rejection rather than something silently normalized on a second pass.
      plain: function () {
        return toPlain(tree);
      },

      /**
       * Canonical JSON bytes with the named TOP-LEVEL keys removed.
       *
       * Removes the KEY, not its value -- the canonical form must contain no
       * such key at all, which is what omitempty achieves on the producer side.
       * Mirrors core.RecordHashFromBytes.
       */
      canonicalBytesExcluding: function (excludeKeys) {
        var kept = { t: "o", keys: [], values: {} };
        for (var i = 0; i < tree.keys.length; i++) {
          var k = tree.keys[i];
          if (excludeKeys.indexOf(k) === -1) {
            kept.keys.push(k);
            kept.values[k] = tree.values[k];
          }
        }
        var out = [];
        serialize(kept, out);
        return new TextEncoder().encode(out.join(""));
      },
    };
  }

  global.PlainRealJCS = {
    canonicalize: canonicalize,
    canonicalizeToBytes: canonicalizeToBytes,
    readObject: readObject,
    MAX_SAFE_INTEGER: MAX_SAFE_INTEGER,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

/* ===== verifier/src/sha3.js ===== */
/*
 * SHA3-256 (NIST FIPS 202) for the browser.
 *
 * Vendored because WebCrypto does not offer it -- subtle.digest supports only
 * SHA-1 and SHA-2 (256/384/512). There is no feature-detect-and-fall-back path
 * available here: this implementation is the only one, in every browser.
 *
 * THIS IS FIPS 202 SHA3-256, NOT LEGACY KECCAK-256.
 * The two differ by a single domain-separation byte during padding: SHA-3
 * appends 0x06, original Keccak appends 0x01. Everything else -- the
 * permutation, the rate, the capacity -- is identical, so the wrong constant
 * produces a perfectly well-formed 64-hex digest that silently disagrees with
 * the substrate on every artifact. The empty-string digest is asserted in the
 * test suite precisely because it is the cheapest way to tell the two apart.
 *
 * Classic script: no import/export, so it loads from file://.
 */

  var OUTPUT_BYTES = 32;

  // Keccak-f[1600] round constants, split into low/high 32-bit halves because
  // JS has no native 64-bit integer arithmetic that is fast enough here.

    0x00000001, 0x00008082, 0x0000808a, 0x80008000, 0x0000808b, 0x80000001,
    0x80008081, 0x00008009, 0x0000008a, 0x00000088, 0x80008009, 0x8000000a,
    0x8000808b, 0x0000008b, 0x00008089, 0x00008003, 0x00008002, 0x00000080,
    0x0000800a, 0x8000000a, 0x80008081, 0x00008080, 0x80000001, 0x80008008,
  ];
  var RC_HI = [
    0x00000000, 0x00000000, 0x80000000, 0x80000000, 0x00000000, 0x00000000,
    0x80000000, 0x80000000, 0x00000000, 0x00000000, 0x00000000, 0x00000000,
    0x00000000, 0x80000000, 0x80000000, 0x80000000, 0x80000000, 0x80000000,
    0x00000000, 0x80000000, 0x80000000, 0x80000000, 0x00000000, 0x80000000,
  ];

  // Rho rotation offsets, indexed by lane = x + 5*y.
  var ROT = [
    0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8,
    18, 2, 61, 56, 14,
  ];

  // Pi destination for each source lane: dest = y + 5*((2x + 3y) mod 5).
  var PI = new Array(25);
  for (var y = 0; y < 5; y++) {
    for (var x = 0; x < 5; x++) {
      PI[x + 5 * y] = y + 5 * ((2 * x + 3 * y) % 5);
    }
  }

  // Keccak-f[1600]. State is 25 lanes of 64 bits, held as parallel arrays of
  // low and high 32-bit halves.
  function keccakF(sLo, sHi) {
    var cLo = new Int32Array(5);
    var cHi = new Int32Array(5);

    for (var round = 0; round < 24; round++) {

        cHi[i] = sHi[i] ^ sHi[i + 5] ^ sHi[i + 10] ^ sHi[i + 15] ^ sHi[i + 20];
      }

 * The standalone CLI refused the same file, which is how it was found.
 *
 * So: hashing stays byte-faithful and envelope-lenient; CONFORMANCE is checked
 * against TOP_LEVEL_KEYS, and only after the signature has been checked, so a
 * tampered record still reports as tampered rather than as malformed.
 *
 * FOUR OUTCOMES THAT MUST NEVER BLUR
 * -----------------------------------
 *   NOT_A_RECORD      unparseable, or not record-shaped. A stranger who
 *                       drops in a random JSON file must NOT see "tampered" --
 *                       crying tamper on garbage makes the real tamper demo
 *                       look like theatre, and it is the first thing a
 *                       sceptical engineer tries.
 *   FAILS_VERIFICATION  parsed fine; hash or signature does not match. THIS is
 *                       the tamper result.
 *   COULD_NOT_VERIFY    a primitive was missing or something threw. Fail
 *                       closed: say plainly that verification did not happen.
 *                       Never render a pass that was not computed, and never
 *                       let this look like FAILS_VERIFICATION -- "we could not
 *                       check" is not "it is bad".
 *   UNKNOWN_KEY         signed by a key this page does not hold. NOT a failed
 *                       signature. Point at the standalone CLI.
 *   VERIFIED            all checks computed and passed.
 *
 * Classic script: no import/export. Depends on jcs.js, sha3.js, ed25519.js.
 */
(function (global) {
  "use strict";

  var OUTCOME = {
    VERIFIED: "VERIFIED",
    FAILS_VERIFICATION: "FAILS_VERIFICATION",
    NOT_A_RECORD: "NOT_A_RECORD",
    COULD_NOT_VERIFY: "COULD_NOT_VERIFY",
    UNKNOWN_KEY: "UNKNOWN_KEY",
  };

  var HEX64 = /^[0-9a-f]{64}$/;
  var HEX128 = /^[0-9a-f]{128}$/;

  // Fields whose presence identifies a document as a record at all.
  // Deliberately minimal: this decides "is this the right KIND of document",
  // not "is it valid". Demanding the full field set here would reject a newer
  // producer's artifact as "not a record", which is the same overclaim in a
  // different costume.
  var IDENTIFYING_FIELDS = ["record_version", "record_id", "signing_key_id"];

  // The frozen 33 (spec section 2.3 / section 6). A conformant schema-1.0.0
  // record carries these and nothing else at the top level.
  //
  // Hardcoded because this page ships as one self-contained file and cannot read
  // a manifest at runtime. That makes drift from Go's core.topLevelKeys the risk,
  // so the suite asserts this array equals the list generated FROM Go into
  // record_cases.json ("top_level_keys"). Go is the reference; if the two
  // disagree the suite fails rather than this page quietly enforcing a stale
  // schema. Same arrangement as the JCS vectors, for the same reason.
  var TOP_LEVEL_KEYS = [
    "action_type", "authorization_token_id", "availability_policy",
    "capture_layer", "causality_chain_hash", "consequential", "created_at",
    "decision_kind", "deployment_mode", "evidence_tier", "execution_context",
    "execution_result", "full_prompt_snapshot", "governance_context",
    "input_hash", "instrumentation_coverage", "lock_verification_latency_ms",
    "model_name", "model_provider", "model_version_hash",
    "output_pre_postprocess", "policy_version_hash", "principal_identity",
    "provenance", "rag_evidence_bundle", "record_id", "record_version",
    "registry_validation_status", "sdk_binary_sha3", "sdk_hash_layer",
    "signing_attestation", "signing_key_id", "tool_call_log",
  ];

  // Top-level keys present in the document that are not in the frozen 33.
  // Envelope contents are deliberately NOT inspected -- that is where section 6
  // permits growth.
  function unknownTopLevelKeys(keys) {
    var unknown = [];
    for (var i = 0; i < keys.length; i++) {
      if (TOP_LEVEL_KEYS.indexOf(keys[i]) === -1) unknown.push(keys[i]);
    }
    return unknown;
  }

  function hexToBytes(hex) {
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) {
      out[i] = parseInt(hex.substr(i * 2, 2), 16);
    }
    return out;
  }

  /**
   * keyFingerprint(rawPublicKeyHex) -> 64 lowercase hex
   *
   * Spec section 4.5: signing_key_id = SHA3-256(raw 32-byte Ed25519 public key).
   * COMPUTED, never hard-coded -- so the page cannot drift from the key it
   * actually carries, and so a reader can check the embedded key against the
   * README and the DNS record themselves.
   */
  function keyFingerprint(rawPublicKeyHex) {
    return global.PlainRealSHA3.sha3_256Hex(hexToBytes(rawPublicKeyHex));
  }

  /*
   * Real elapsed time, for showing a reader what was actually computed.
   *
   * These are MEASURED, never staged. The page displays them because
   * verification finishing in single-digit milliseconds looks like nothing
   * happened -- and the honest answer to that is to show the work, not to slow
   * it down. Anyone can time the same operations themselves and check.
   */
  function now() {
    return typeof performance !== "undefined" && performance.now
      ? performance.now()
      : 0;
  }

  function result(outcome, headline, detail, extra) {
    var r = {
      outcome: outcome,
      headline: headline,
      detail: detail,
      recordHash: null,
      signingKeyId: null,
      facts: null,
      brokenField: null,
      timings: null,
    };
    if (extra) {
      for (var k in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, k)) r[k] = extra[k];
      }
    }
    return r;
  }

  // Fields worth surfacing. Only what the SIGNATURE actually covers.
  //
  // The S3 custody facts a reader might expect here -- bucket, key, VersionId,
  // RetainUntilDate, Mode=COMPLIANCE -- are NOT fields of the record. They
  // live in the seal response and the index. The only WORM-related signed
  // fields are the declared retention_class and lock_verification_latency_ms.
  // So custody cannot be proven from the artifact alone, and nothing here
  // pretends otherwise.
  function extractFacts(doc) {
    var gov = doc.governance_context;
    return {
      recordId: typeof doc.record_id === "string" ? doc.record_id : null,
      recordVersion:
        typeof doc.record_version === "string" ? doc.record_version : null,
      evidenceTier:
        typeof doc.evidence_tier === "string" ? doc.evidence_tier : null,
      decisionKind:
        typeof doc.decision_kind === "string" ? doc.decision_kind : null,
      actionType: typeof doc.action_type === "string" ? doc.action_type : null,
      createdAt: typeof doc.created_at === "string" ? doc.created_at : null,
      captureLayer:
        typeof doc.capture_layer === "string" ? doc.capture_layer : null,
      // Declared class the Object Lock is DERIVED FROM -- not a label describing
      // a lock this page has seen.
      retentionClass:
        gov && typeof gov.retention_class === "string" ? gov.retention_class : null,
      lockVerificationLatencyMs:
        typeof doc.lock_verification_latency_ms === "number"
          ? doc.lock_verification_latency_ms
          : null,

    };

  /**
   * verifyArtifact(jsonText, embeddedPublicKeyHex) -> result
   *
   * Never throws. Every failure path returns one of the five outcomes, because
   * a thrown error at a call site is exactly how "could not check" gets
   * rendered as "checked and fine".
   */
  function verifyArtifact(jsonText, embeddedPublicKeyHex) {
    // --- 1. Is it JSON at all? -------------------------------------------
    var t = { parseMs: 0, canonicalMs: 0, digestMs: 0, signatureMs: 0,
              inputBytes: 0, canonicalBytes: 0 };
    try {
      t.inputBytes = new TextEncoder().encode(jsonText).length;
    } catch (e) { /* measurement only; never fails the verdict */ }

    var handle;
    var tStart = now();
    try {
      handle = global.PlainRealJCS.readObject(jsonText);
      t.parseMs = now() - tStart;
    } catch (e) {
      return result(
        OUTCOME.NOT_A_RECORD,
        "This is not a record.",
        "Could not read this as JSON: " + e.message +
          " Nothing was verified. This is not a claim that anything is wrong " +
          "with the file.",
        {}
      );
    }

    var doc;
    try {
      doc = handle.plain();
    } catch (e) {
      return result(
        OUTCOME.COULD_NOT_VERIFY,
        "Verification could not be performed.",
        "The document parsed but could not be read: " + e.message,
        {}
      );
    }

    // --- 2. Is it record-SHAPED? ---------------------------------------
    var missing = [];
    for (var i = 0; i < IDENTIFYING_FIELDS.length; i++) {
      if (!handle.has(IDENTIFYING_FIELDS[i])) missing.push(IDENTIFYING_FIELDS[i]);
    }
    if (missing.length > 0) {
      return result(
        OUTCOME.NOT_A_RECORD,
        "This is not a record.",
        "Valid JSON, but missing " + missing.join(", ") +
          ". Nothing was verified. This is not a claim that the file was altered.",
        {}
      );
    }

    var facts = extractFacts(doc);
    facts.topLevelFieldCount = handle.keys.length;

    // A record-shaped document with no signature was never sealed. That is a
    // different thing from a broken signature and must not read as one.
    if (!handle.has("signing_attestation")) {
      return result(
        OUTCOME.NOT_A_RECORD,
        "This is not a sealed record.",
        "This has the shape of a record but carries no signature, " +
          "so it was never sealed. There is nothing to check.",
        { facts: facts, signingKeyId: facts.recordId ? doc.signing_key_id : null }
      );
    }

    var signature = handle.getString("signing_attestation");
    var signingKeyId = handle.getString("signing_key_id");

    // --- 3. Are the crypto fields well-formed? ---------------------------
    if (signature === null || !HEX128.test(signature)) {
      return result(
        OUTCOME.FAILS_VERIFICATION,
        "This record does not verify.",
        "signing_attestation is not a 128-character lowercase hex signature, " +
          "so there is nothing to check it against.",
        { facts: facts, signingKeyId: signingKeyId, brokenField: "signing_attestation" }
      );
    }
    if (signingKeyId === null || !HEX64.test(signingKeyId)) {
      return result(
        OUTCOME.FAILS_VERIFICATION,
        "This record does not verify.",
        "signing_key_id is not a 64-character lowercase hex fingerprint.",
        { facts: facts, signingKeyId: signingKeyId, brokenField: "signing_key_id" }
      );
    }

    // --- 4. Is it signed by a key this page holds? -----------------------
    // BEFORE the signature check, deliberately. Verifying against a key we know
    // is the wrong one would produce a red "invalid signature" for a record
    // that is very likely fine — the page just cannot speak to it.
    var ourFingerprint;
    try {
      ourFingerprint = keyFingerprint(embeddedPublicKeyHex);
    } catch (e) {
      return result(
        OUTCOME.COULD_NOT_VERIFY,
        "Verification could not be performed.",
        "The embedded public key could not be read: " + e.message,
        { facts: facts, signingKeyId: signingKeyId }
      );
    }

    if (signingKeyId !== ourFingerprint) {
      return result(
        OUTCOME.UNKNOWN_KEY,
        "Signed by a key this page does not have.",
        "This record was signed by key " + signingKeyId.slice(0, 16) + "…. " +
          "This page holds only the demo key that signed the samples (" +
          ourFingerprint.slice(0, 16) + "…). That is not a failed signature. " +
          "This page cannot check it. Use the standalone CLI, which takes any " +
          "public key.",
        { facts: facts, signingKeyId: signingKeyId }
      );
    }

    // --- 5. Recompute record_hash from the artifact's OWN bytes --------
    var recordHash;
    try {
      var tCanon = now();
      var canonicalBytes = handle.canonicalBytesExcluding(["signing_attestation"]);
      t.canonicalMs = now() - tCanon;
      t.canonicalBytes = canonicalBytes.length;

      var tDigest = now();
      recordHash = global.PlainRealSHA3.sha3_256Hex(canonicalBytes);
      t.digestMs = now() - tDigest;
    } catch (e) {
      return result(
        OUTCOME.COULD_NOT_VERIFY,
        "Verification could not be performed.",
        "The canonical form could not be computed: " + e.message +
          " No verdict was reached. This says nothing about the record.",
        { facts: facts, signingKeyId: signingKeyId }
      );
    }

    // --- 6. Check the signature ------------------------------------------
    // The signed message is the 32 RAW bytes of the hash, not its hex text.
    var valid;
    try {
      var tSig = now();
      valid = global.PlainRealEd25519.verify(
        hexToBytes(embeddedPublicKeyHex),
        hexToBytes(recordHash),
        hexToBytes(signature)
      );
      t.signatureMs = now() - tSig;
    } catch (e) {
      return result(
        OUTCOME.COULD_NOT_VERIFY,
        "Verification could not be performed.",
        "The signature check did not finish: " + e.message,
        { facts: facts, signingKeyId: signingKeyId, recordHash: recordHash }
      );
    }

    if (!valid) {
      return result(
        OUTCOME.FAILS_VERIFICATION,
        "This record does not verify.",
        "The signature does not match the contents. Either the record changed " +
          "after signing, or the signature belongs to something else. This shows " +
          "the bytes are not what was sealed. It does not show who changed them.",
        { facts: facts, signingKeyId: signingKeyId, recordHash: recordHash,
          timings: t }
      );
    }

    // --- 7. Is it a CONFORMANT schema-1.0.0 record? ----------------------
    // The signature is valid, so the bytes are what was sealed. That is not the
    // same as the document being a record: section 6 freezes the top-level field
    // list, and a key outside it is someone inventing a field rather than
    // growing an envelope.
    //
    // Deliberately AFTER the signature check. Running it earlier would report a
    // tampered record -- one with a field appended after sealing -- as malformed
    // rather than as altered, throwing away the strongest signal the page has
    // and the field-level diff that goes with it. Ordering this last means each
    // failure is described by the most serious true thing about it.
    var unknown = unknownTopLevelKeys(handle.keys);
    if (unknown.length > 0) {
      return result(
        OUTCOME.NOT_A_RECORD,
        "This is not a conformant record.",
        "The signature is valid — these bytes are what was signed, and this is " +
          "not a claim that anything was altered. But the document carries " +
          (unknown.length === 1 ? "a top-level field" : unknown.length + " top-level fields") +
          " that schema 1.0.0 does not define: " + unknown.join(", ") + ". The " +
          "33-field list is frozen, and new capability belongs inside a " +
          "versioned envelope, so this page will not report it as a record.",
        { facts: facts, signingKeyId: signingKeyId, recordHash: recordHash,
          timings: t }
      );
    }

    return result(
      OUTCOME.VERIFIED,
      "This record is intact.",
      "The signature matches the contents exactly. Every byte is what was " +
        "signed. This proves the record has not changed. It does not prove the " +
        "decision was right.",
      { facts: facts, signingKeyId: signingKeyId, recordHash: recordHash,
        timings: t }
    );
  }

  /**
   * diffFields(originalText, editedText) -> [{path, from, to, kind}] or null
   *
   * Names WHICH field changed, for the live-edit tamper demo.
   *
   * Returns null when there is no pristine original to compare against. That is
   * the honest answer for pasted JSON: from a single artifact it is provable
   * that the bytes are not what was signed, but NOT which field moved -- the
   * signature covers the whole document and a hash gives up no structure. Only
   * a loaded sample, where the untouched copy is in hand, can name the field.
   * Guessing would be a fabricated claim on the page whose whole point is not
   * overclaiming.
   */

      return null;
    }
    var a, b;

      a = global.PlainRealJCS.readObject(originalText).plain();
      b = global.PlainRealJCS.readObject(editedText).plain();
    } catch (e) {
      return null;
    }

    var changes = [];

    function describe(v) {
      if (v === undefined) return "(absent)";
      if (v === null) return "null";
      if (typeof v === "string") return JSON.stringify(v);
      if (typeof v === "object") return Array.isArray(v) ? "[…]" : "{…}";
      return String(v);
    }

    function walk(x, y, path) {
      if (changes.length > 50) return; // legibility, not correctness

      var xIsObj = x !== null && typeof x === "object" && !Array.isArray(x);
      var yIsObj = y !== null && typeof y === "object" && !Array.isArray(y);

      if (xIsObj && yIsObj) {
        var seen = {};
        var k;
        for (k in x) if (Object.prototype.hasOwnProperty.call(x, k)) seen[k] = true;
        for (k in y) if (Object.prototype.hasOwnProperty.call(y, k)) seen[k] = true;
        for (k in seen) {
          if (!Object.prototype.hasOwnProperty.call(seen, k)) continue;
          var sub = path ? path + "." + k : k;
          var inX = Object.prototype.hasOwnProperty.call(x, k);
          var inY = Object.prototype.hasOwnProperty.call(y, k);
          if (!inX) {
            changes.push({ path: sub, from: "(absent)", to: describe(y[k]), kind: "added" });
          } else if (!inY) {
            changes.push({ path: sub, from: describe(x[k]), to: "(absent)", kind: "removed" });
          } else {
            walk(x[k], y[k], sub);
          }
        }
        return;
      }

      var xIsArr = Array.isArray(x);
      var yIsArr = Array.isArray(y);
      if (xIsArr && yIsArr) {
        if (x.length !== y.length) {
          changes.push({
            path: path,
            from: x.length + " items",
            to: y.length + " items",
            kind: "changed",
          });
          return;
        }
        for (var i = 0; i < x.length; i++) {
          walk(x[i], y[i], path + "[" + i + "]");
        }
        return;
      }

      if (x !== y) {
        changes.push({ path: path, from: describe(x), to: describe(y), kind: "changed" });
      }
    }

    walk(a, b, "");
    return changes;
  }

  global.PlainRealRecord = {
    OUTCOME: OUTCOME,
    verifyArtifact: verifyArtifact,
    diffFields: diffFields,
    keyFingerprint: keyFingerprint,
    // Exposed so the suite can hold this copy against the list generated FROM
    // Go. Not used by the page itself.
    TOP_LEVEL_KEYS: TOP_LEVEL_KEYS,

})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
/*
 * The assertions. Single source of truth, run by BOTH the Node runner and the
 * in-browser suite.
 *
 * This file exists so the two cannot drift. A browser-only bug is the whole
 * risk being managed here; a browser suite that tests slightly different things
 * from the Node suite would hide exactly the divergence it was built to find.
 *
 * Classic script, no import/export, no Node APIs: it has to run from file://.
 * All input data is passed in, never read from disk.
 */
(function (global) {
  "use strict";

  function hexToBytes(h) {
    var out = new Uint8Array(h.length / 2);
    for (var i = 0; i < out.length; i++) {
      out[i] = parseInt(h.substr(i * 2, 2), 16);
    }
    return out;
  }

  function bytesToHex(b) {
    var s = "";
    for (var i = 0; i < b.length; i++) {
      var h = b[i].toString(16);
      s += h.length === 1 ? "0" + h : h;
    }
    return s;
  }

  function utf8(s) {
    return new TextEncoder().encode(s);
  }

  // A suite collects failures rather than throwing, so one bad assertion does
  // not hide the rest.
  function Suite(name) {
    this.name = name;
    this.checks = 0;
    this.failures = [];
  }
  Suite.prototype.eq = function (label, actual, expected) {
    this.checks++;
    if (actual !== expected) {
      this.failures.push(
        label + "\n    expected: " + expected + "\n    actual:   " + actual
      );
    }
  };
  Suite.prototype.fail = function (label) {
    this.checks++;
    this.failures.push(label);
  };
  Suite.prototype.ok = function () {
    this.checks++;
  };

  /* --- 1. JCS contract vectors ------------------------------------------ */

  function suiteJCSVectors(data, JCS, SHA3) {
    var s = new Suite("JCS contract vectors");
    var vectors = data.jcsVectors;
    for (var i = 0; i < vectors.length; i++) {
      var v = vectors[i];
      var text =
        typeof v.input === "string" ? v.input : JSON.stringify(v.input);
      try {
        s.eq("jcs " + v.id, JCS.canonicalize(text), v.expected_jcs);
        if (v.expected_sha3_256_hex) {
          s.eq(
            "hash " + v.id,
            SHA3.sha3_256Hex(JCS.canonicalizeToBytes(text)),
            v.expected_sha3_256_hex

        }
      } catch (e) {
        s.fail("jcs " + v.id + " threw: " + e.message);
      }
    }
    return s;
  }

  /* --- 2. Differential against Go on adversarial input ------------------ */

  function suiteDifferential(data, JCS) {
    var s = new Suite("JCS differential vs Go");
    var goByID = {};
    for (var g = 0; g < data.goResults.length; g++) {
      goByID[data.goResults[g].id] = data.goResults[g];
    }

    for (var i = 0; i < data.adversarialInputs.length; i++) {
      var input = data.adversarialInputs[i];
      var go = goByID[input.id];
      if (!go) {
        s.fail("no Go result for " + input.id);
        continue;
      }

      var accepted, output, err;
      try {
        output = JCS.canonicalize(input.json);
        accepted = true;
      } catch (e) {
        accepted = false;
        err = e.message;
      }

      s.checks++;
      if (accepted !== go.accepted) {
        // JS accepting what Go rejects is the direction that puts a false
        // "this record is sound" in front of a reader.
        s.failures.push(
          (accepted ? "JS-ACCEPTS-GO-REJECTS " : "JS-REJECTS-GO-ACCEPTS ") +
            input.id +
            " -- " + input.note +
            "\n    " + (accepted ? "js produced: " + output + " | go: " + go.error
                                 : "go produced: " + go.output + " | js: " + err)
        );
        continue;
      }

      if (accepted) {
        // Compare UTF-8 BYTES. Bytes are what get hashed; a string comparison
        // could pass or fail on encoding details that never reach the digest.
        var a = bytesToHex(utf8(output));
        var b = bytesToHex(utf8(go.output));
        if (a !== b) {
          s.failures.push(
            "BYTES-DIFFER " + input.id + "\n    go: " + b + "\n    js: " + a
          );
        }
      }
    }
    return s;
  }

  /* --- 3. SHA3-256 ------------------------------------------------------- */

  function suiteSHA3(data, SHA3) {
    var s = new Suite("SHA3-256");

    s.eq(
      'SHA3-256("")',
      SHA3.sha3_256Hex(utf8("")),
      "a7ffc6f8bf1ed76651c14756a061d662f580ff4de43b49fa82d80a4b80f8434a"
    );
    s.eq(
      'SHA3-256("abc")',
      SHA3.sha3_256Hex(utf8("abc")),
      "3a985da74fe225b2045c172d6bd390bd855f086e3e9d525b46bfe24511431532"
    );

    // The discriminator: a 0x01 domain byte instead of 0x06 silently yields
    // legacy Keccak-256 -- a well-formed digest that is wrong everywhere.
    s.checks++;
    if (
      SHA3.sha3_256Hex(utf8("")) ===
      "c5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470"
    ) {
      s.failures.push(
        "digest is legacy Keccak-256, not NIST SHA3-256 (domain byte must be 0x06)"
      );
    }

    // padding bugs live. Precomputed by Node's OpenSSL.
    for (var i = 0; i < data.sha3Lengths.length; i++) {
      var c = data.sha3Lengths[i];
      var buf = new Uint8Array(c.len);
      for (var j = 0; j < c.len; j++) buf[j] = (j * 97 + 13) & 0xff;
      s.eq("sha3 len=" + c.len, SHA3.sha3_256Hex(buf), c.hex);
    }
    return s;
  }

  /* --- 4. SHA-512 (Ed25519 depends on it) -------------------------------- */

  function suiteSHA512(data, SHA512) {
    var s = new Suite("SHA-512");
    s.eq(
      'SHA-512("")',
      bytesToHex(SHA512.sha512(utf8(""))),
      "cf83e1357eefb8bdf1542850d66d8007d620e4050b5715dc83f4a921d36ce9ce" +
        "47d0d13c5d85f2b0ff8318d2877eec2f63b931bd47417a81a538327af927da3e"
    );
    s.eq(
      'SHA-512("abc")',
      bytesToHex(SHA512.sha512(utf8("abc"))),
      "ddaf35a193617abacc417349ae20413112e6fa4e89a97ea20a9eeee64b55d39a" +
        "2192992a274fc1a836ba3c23a3feebbd454d4423643ce80e2a9ac94fa54ca49f"
    );
    for (var i = 0; i < data.sha512Lengths.length; i++) {
      var c = data.sha512Lengths[i];
      var buf = new Uint8Array(c.len);
      for (var j = 0; j < c.len; j++) buf[j] = (j * 97 + 13) & 0xff;
      s.eq("sha512 len=" + c.len, bytesToHex(SHA512.sha512(buf)), c.hex);
    }
    return s;
  }

  /* --- 5. Ed25519 against the Go oracle ---------------------------------- */

  function suiteEd25519(data, ED) {
    var s = new Suite("Ed25519 vs Go oracle");
    for (var i = 0; i < data.ed25519Cases.length; i++) {
      var c = data.ed25519Cases[i];
      var actual = ED.verify(
        hexToBytes(c.public_key),
        hexToBytes(c.message),
        hexToBytes(c.signature)
      );
      s.checks++;
      if (actual !== c.valid) {
        s.failures.push(
          (actual ? "JS-ACCEPTS-GO-REJECTS " : "JS-REJECTS-GO-ACCEPTS ") +
            c.id + " -- " + c.note +
            "\n    go: " + c.valid + "   js: " + actual
        );
      }
    }
    return s;
  }

  /* --- 5b. Curve algebra --------------------------------------------------
   *
   * Everything else tests input -> output. These test the GROUP STRUCTURE.
   *
   * A wrong curve constant or a subtly broken addition formula can still
   * verify a particular set of signatures by coincidence -- 76 cases agreeing
   * with Go proves the two agree, not that either is right. If the algebra
   * below holds, the implementation is operating on the actual Ed25519 group.
   */
  function suiteCurve(data, ED) {
    var s = new Suite("Curve algebra");
    var C = ED._curve;
    if (!C) { s.fail("curve internals not exposed"); return s; }

    var eq = function (P, Q) {
      // Projective equality: X1*Z2 == X2*Z1 and Y1*Z2 == Y2*Z1.
      return C.mod(P.X * Q.Z) === C.mod(Q.X * P.Z) &&
             C.mod(P.Y * Q.Z) === C.mod(Q.Y * P.Z);
    };

    var B = C.BASE, O = C.IDENTITY;
    var P2 = C.scalarMult(2n, B);
    var P3 = C.scalarMult(3n, B);
    var P5 = C.scalarMult(5n, B);

    // --- field ---
    s.eq("p is 2^255 - 19", C.p, (1n << 255n) - 19n);
    s.eq("sqrt(-1)^2 == -1", C.mod(C.SQRT_M1 * C.SQRT_M1), C.mod(-1n));
    s.eq("a * inv(a) == 1", C.mod(12345n * C.inv(12345n)), 1n);
    s.eq("Fermat holds for a random element", C.modPow(7n, C.p - 1n, C.p), 1n);

    // --- group laws ---
    s.checks++;
    if (!eq(C.add(B, P2), C.add(P2, B))) s.failures.push("addition is not commutative");
    s.checks++;
    if (!eq(C.add(C.add(B, P2), P3), C.add(B, C.add(P2, P3))))
      s.failures.push("addition is not associative");
    s.checks++;
    if (!eq(C.add(B, O), B)) s.failures.push("identity is not neutral");
    s.checks++;
    if (!eq(C.add(B, C.negate(B)), O)) s.failures.push("P + (-P) is not the identity");
    s.checks++;
    if (!eq(C.add(B, B), P2)) s.failures.push("P + P != [2]P");
    s.checks++;
    if (!eq(C.add(P2, P3), P5)) s.failures.push("[2]P + [3]P != [5]P");

    // --- the decisive one: base point order ---
    // [L]B must be the identity. If the curve constant d, the base point, or
    // the addition formula were wrong, this fails even when signatures verify.
    s.checks++;
    if (!eq(C.scalarMult(C.L, B), O))
      s.failures.push("[L]B is not the identity -- the group order is wrong");

    // [L+1]B == B follows, and catches an off-by-one in scalarMult.
    s.checks++;
    if (!eq(C.scalarMult(C.L + 1n, B), B))
      s.failures.push("[L+1]B != B");

    // --- scalar arithmetic is a homomorphism ---
    var a = 987654321n, bb = 123456789n;
    s.checks++;
    if (!eq(C.add(C.scalarMult(a, B), C.scalarMult(bb, B)), C.scalarMult(a + bb, B)))
      s.failures.push("[a]B + [b]B != [a+b]B");

    // --- encode / decode round-trip ---
    var k = 1n;
    for (var i = 0; i < 12; i++) {
      k = (k * 7919n + 13n) % C.L;
      var P = C.scalarMult(k, B);
      var back = C.decodePoint(C.encodePoint(P));
      s.checks++;
      if (back === null) {
        s.failures.push("encode/decode round-trip failed for k=" + k + " (decode returned null)");
      } else if (!eq(P, back)) {
        s.failures.push("encode/decode round-trip changed the point for k=" + k);
      }
    }

    // --- decode must reject what is not on the curve ---
    var bad = new Uint8Array(32);
    for (var j = 0; j < 32; j++) bad[j] = 0xff;   // y >= p, non-canonical
    s.checks++;
    if (C.decodePoint(bad) !== null)
      s.failures.push("decodePoint accepted a non-canonical y >= p");

    return s;
  }

  /* --- 6. Record verification and the outcome taxonomy ----------------- */

  function suiteRecord(data, RECORD) {
    var s = new Suite("Record outcomes");
    var O = RECORD.OUTCOME;

    for (var i = 0; i < data.recordCases.length; i++) {
      var c = data.recordCases[i];
      var r;
      try {
        r = RECORD.verifyArtifact(c.artifact, c.public_key);
      } catch (e) {
        s.fail(c.id + " threw: " + e.message + " (verifyArtifact must never throw)");
        continue;
      }

      s.eq(c.id + " (" + c.note + ")", r.outcome, c.expected_outcome);

      // Cross-check against Go where Go reached a verdict at all.
      //
      // go_valid is core.VerifyRecordBytes -- a SIGNATURE verdict and nothing
      // more. Our taxonomy is finer in both directions: UNKNOWN_KEY is Go's
      // false, and a valid signature over a document carrying an invented
      // top-level field is Go's true while being NOT_A_RECORD here (section 6
      // freezes the 33; Go draws the same line in ValidateArtifactBytes, which
      // this boolean does not run).
      //
      // So the assertion is the narrow true one: a valid signature must never be
      // reported as FAILS_VERIFICATION. Asserting VERIFIED here instead is what
      // let D1 through -- it encoded "Go says the bytes are signed" as "the page
      // must call it intact", which is precisely the conflation at issue.
      if (c.go_valid === true) {
        s.checks++;
        if (r.outcome === O.FAILS_VERIFICATION) {
          s.failures.push(
            c.id + ": Go verified the signature but the page reports tampering"
          );
        }
      } else if (c.go_valid === false && c.expected_outcome !== O.UNKNOWN_KEY) {
        s.eq(c.id + " agrees with Go (invalid)", r.outcome, O.FAILS_VERIFICATION);
      }

      // A pass must never be reported without a recomputed hash behind it.
      if (r.outcome === O.VERIFIED) {
        s.checks++;
        if (!/^[0-9a-f]{64}$/.test(r.recordHash || "")) {
          s.failures.push(c.id + ": VERIFIED without a recomputed record_hash");
        }
      }
    }

    // The frozen 33 this page enforces must be the frozen 33 Go enforces.
    // This page cannot read a manifest at runtime, so it carries its own copy;
    // that copy is only trustworthy while something compares it to the source of
    // truth. Sorted before comparing -- order is not part of the contract.
    var jsKeys = (RECORD.TOP_LEVEL_KEYS || []).slice().sort();
    var goKeys = (data.goTopLevelKeys || []).slice().sort();
    s.eq("frozen field list has 33 entries", String(jsKeys.length), "33");
    s.eq(
      "frozen field list matches Go's core.topLevelKeys",
      jsKeys.join(","),
      goKeys.join(",")
    );

    // The committed fixture, through the real path.
    var fx = RECORD.verifyArtifact(
      data.fixtureArtifact,
      data.fixturePublicKeyHex
    );
    s.eq("fixture verifies", fx.outcome, O.VERIFIED);
    s.eq(
      "fixture key fingerprint matches its signing_key_id (spec 4.5)",
      RECORD.keyFingerprint(data.fixturePublicKeyHex),
      fx.signingKeyId
    );

    // Garbage must never be reported as tampering. This is the first thing a
    // sceptical engineer tries, and crying tamper here would make the real
    // tamper demo look like theatre.
    var garbage = ["", "   ", "null", "42", '"a string"', "{", "{}", "[]", "<html>"];
    for (var g = 0; g < garbage.length; g++) {
      var gr = RECORD.verifyArtifact(garbage[g], data.fixturePublicKeyHex);
      s.checks++;
      if (gr.outcome !== O.NOT_A_RECORD) {
        s.failures.push(
          "garbage input " + JSON.stringify(garbage[g]) +
            " produced " + gr.outcome + ", must be NOT_A_RECORD"
        );
      }
    }

    return s;
  }

  /* --- 7. Field-level diff for the tamper demo --------------------------- */

  function suiteDiff(data, RECORD) {
    var s = new Suite("Tamper diff");

    var original = data.fixtureArtifact;

    function editedWith(mutate) {
      var doc = global.PlainRealJCS.readObject(original).plain();
      mutate(doc);
      return JSON.stringify(doc);
    }

    var d1 = RECORD.diffFields(
      original,
      editedWith(function (d) { d.action_type = "changed_value"; })
    );
    s.eq("top-level change count", d1.length, 1);
    s.eq("top-level change path", d1[0].path, "action_type");

    var d2 = RECORD.diffFields(
      original,
      editedWith(function (d) { d.governance_context.retention_class = "DEV_EPHEMERAL"; })
    );
    s.eq("nested change count", d2.length, 1);
    s.eq("nested change path", d2[0].path, "governance_context.retention_class");

    var d3 = RECORD.diffFields(
      original,
      editedWith(function (d) { delete d.capture_layer; })
    );
    s.eq("removal detected", d3.length, 1);
    s.eq("removal kind", d3[0].kind, "removed");

    var d4 = RECORD.diffFields(original, original);
    s.eq("identical documents produce no diff", d4.length, 0);

    // Naming the field requires a pristine original. For pasted JSON there
    // isn't one, and the honest answer is "cannot say which field" rather than
    // a guess -- a hash gives up no structure.
    s.eq("no diff without an original", RECORD.diffFields(null, original), null);

    return s;
  }

  /* --- Runner ------------------------------------------------------------ */

  function runAll(data, env) {
    var suites = [
      suiteJCSVectors(data, env.JCS, env.SHA3),
      suiteDifferential(data, env.JCS),
      suiteSHA3(data, env.SHA3),
      suiteSHA512(data, env.SHA512),
      suiteEd25519(data, env.ED),
      suiteCurve(data, env.ED),
      suiteRecord(data, env.RECORD),
      suiteDiff(data, env.RECORD),
    ];
    var checks = 0, failures = 0;
    for (var i = 0; i < suites.length; i++) {
      checks += suites[i].checks;
      failures += suites[i].failures.length;
    }
    return { suites: suites, checks: checks, failures: failures };
  }

  /*
   * Optional cross-check against WebCrypto's Ed25519, where the browser has it.
   *
   * This is a TEST oracle only -- WebCrypto is deliberately not a shipped code
   * path (see ed25519.js). The value is an independent implementation checking
   * ours at runtime; the cost is nothing, because nothing here ships.
   *
   * Returns a promise. A browser without Ed25519 support reports "unavailable",
   * which is not a failure -- the vendored path is the one that matters.
   */
  function crossCheckWebCrypto(data, ED) {
    var subtle =
      global.crypto && global.crypto.subtle ? global.crypto.subtle : null;
    if (!subtle) {
      return Promise.resolve({ available: false, reason: "no crypto.subtle" });
    }

    var cases = data.ed25519Cases;
    return subtle
      .importKey("raw", hexToBytes(cases[0].public_key), { name: "Ed25519" }, false, ["verify"])
      .then(function () {
        var checked = 0, disagreements = [];
        var chain = Promise.resolve();
        cases.forEach(function (c) {
          chain = chain.then(function () {
            return subtle
              .importKey("raw", hexToBytes(c.public_key), { name: "Ed25519" }, false, ["verify"])
              .then(function (key) {
                return subtle.verify(
                  { name: "Ed25519" },
                  key,
                  hexToBytes(c.signature),
                  hexToBytes(c.message)
                );
              })
              .then(function (webResult) {
                checked++;
                var ours = ED.verify(
                  hexToBytes(c.public_key),
                  hexToBytes(c.message),
                  hexToBytes(c.signature)
                );
                if (webResult !== ours) {
                  disagreements.push({
                    id: c.id,
                    note: c.note,
                    webcrypto: webResult,
                    vendored: ours,
                    go: c.valid,
                    messageBytes: c.message.length / 2,
                  });
                }
              })
              .catch(function () {
                // A key WebCrypto refuses to import is a rejection on its side;
                // agreement means ours must also reject.
                checked++;
                var ours = ED.verify(
                  hexToBytes(c.public_key),
                  hexToBytes(c.message),
                  hexToBytes(c.signature)
                );
                if (ours !== false) {
                  disagreements.push({
                    id: c.id,
                    note: c.note,
                    webcrypto: "refused the input",
                    vendored: ours,
                    go: c.valid,
                    messageBytes: c.message.length / 2,
                  });
                }
              });
          });
        });
        return chain.then(function () {
          return { available: true, checked: checked, disagreements: disagreements };
        });
      })
      .catch(function (e) {
        return {
          available: false,
          reason: "Ed25519 not supported by this browser's WebCrypto",
        };
      });
  }

  global.PlainRealSuites = {
    runAll: runAll,
    crossCheckWebCrypto: crossCheckWebCrypto,
    hexToBytes: hexToBytes,
    bytesToHex: bytesToHex,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
(function () {
  "use strict";
  var envEl = document.getElementById("env");
  var verdictEl = document.getElementById("verdict");
  var suitesEl = document.getElementById("suites");
  var failuresEl = document.getElementById("failures");

  envEl.textContent =
    navigator.userAgent + "  |  origin: " + (location.protocol || "?");

  var result;
  try {
    result = PlainRealSuites.runAll(TEST_DATA, {
      JCS: PlainRealJCS,
      SHA3: PlainRealSHA3,
      SHA512: PlainRealSHA512,
      ED: PlainRealEd25519,
      RECORD: PlainRealRecord,
    });
  } catch (e) {
    verdictEl.className = "fail";
    verdictEl.textContent = "FAIL — suite threw: " + e.message;
    document.body.setAttribute("data-status", "FAIL");
    return;
  }

  function renderSuite(name, checks, failures) {
    var row = document.createElement("div");
    row.className = "suite" + (failures.length ? " bad" : "");
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = (failures.length ? "FAIL  " : "PASS  ") + name;
    var c = document.createElement("span");
    c.className = "c";
    c.textContent = (checks - failures.length) + "/" + checks;
    row.appendChild(n);
    row.appendChild(c);
    suitesEl.appendChild(row);

    if (failures.length) {
      var pre = document.createElement("pre");
      // textContent, never innerHTML: failure strings contain test input.
      pre.textContent = failures.join("\n\n");
      failuresEl.appendChild(pre);
    }
  }

  for (var i = 0; i < result.suites.length; i++) {
    renderSuite(result.suites[i].name, result.suites[i].checks, result.suites[i].failures);
  }

  function setVerdict(failures, checks, extra) {
    var pass = failures === 0;
    verdictEl.className = pass ? "pass" : "fail";
    verdictEl.textContent =
      (pass ? "ALL PASS" : "FAILURES") +
      " — " + (checks - failures) + "/" + checks + " checks" +
      (extra ? "  |  " + extra : "");
    // Machine-readable for headless runs.
    document.body.setAttribute("data-status", pass ? "PASS" : "FAIL");
    document.title =
      (pass ? "PASS" : "FAIL") + " " + (checks - failures) + "/" + checks;
  }

  setVerdict(result.failures, result.checks, "webcrypto cross-check running…");

  /* WebCrypto is a TEST oracle only -- never a shipped code path.
   *
   * The gate is "vendored agrees with Go". That is decided by the Ed25519
   * suite above. When THAT suite passes and WebCrypto still disagrees, the
   * browser is the outlier against two independent implementations, and the
   * honest report is a browser defect -- not a failure of this code.
   *
   * Recording it as a build failure would mean a browser bug could pressure us
   * into "fixing" correct cryptography to match it. Silencing it would throw
   * away a real signal. So: surfaced loudly, scored separately. */
  var edSuite = null;
  for (var q = 0; q < result.suites.length; q++) {
    if (result.suites[q].name === "Ed25519 vs Go oracle") edSuite = result.suites[q];
  }
  var vendoredMatchesGo = edSuite && edSuite.failures.length === 0;

  PlainRealSuites.crossCheckWebCrypto(TEST_DATA, PlainRealEd25519).then(function (x) {
    if (!x.available) {
      renderSuite("WebCrypto cross-check — unavailable", 0, []);
      setVerdict(result.failures, result.checks,
        "no WebCrypto Ed25519 (" + x.reason + ") — vendored path is authoritative");
      return;
    }

    if (x.disagreements.length === 0) {
      renderSuite("WebCrypto cross-check", x.checked, []);
      setVerdict(result.failures, result.checks + x.checked,
        "WebCrypto agreed on all " + x.checked + " cases");
      return;
    }

    // Derive the shape of the divergence from the data rather than asserting
    // it: if every disagreeing case shares a message length, say so.
    var lengths = {}, allAgreeWithGo = true, lines = [];
    for (var i = 0; i < x.disagreements.length; i++) {
      var dis = x.disagreements[i];
      lengths[dis.messageBytes] = (lengths[dis.messageBytes] || 0) + 1;
      if (dis.vendored !== dis.go) allAgreeWithGo = false;
      lines.push(
        dis.id + " (" + dis.note + ")\n" +
        "    message length: " + dis.messageBytes + " bytes\n" +
        "    go: " + dis.go + "   vendored: " + dis.vendored +
        "   this browser's WebCrypto: " + dis.webcrypto
      );
    }
    var lens = Object.keys(lengths);
    var shape = lens.length === 1
      ? "every disagreeing case has a message of exactly " + lens[0] + " bytes"
      : "message lengths involved: " + lens.join(", ");

    var verdictLine;
    if (vendoredMatchesGo && allAgreeWithGo) {
      verdictLine =
        "BROWSER DEFECT — this browser's WebCrypto disagrees with BOTH Go and the " +
        "vendored implementation on " + x.disagreements.length + " of " + x.checked +
        " cases. " + shape + ". The vendored path is correct; this is why it ships " +
        "instead of WebCrypto.";
    } else {
      verdictLine =
        "WebCrypto disagrees on " + x.disagreements.length + " cases AND the vendored " +
        "path does not match Go — investigate the vendored code first.";
    }

    renderSuite(
      "WebCrypto cross-check — " +
        (vendoredMatchesGo && allAgreeWithGo ? "BROWSER DIVERGES" : "FAIL"),
      x.checked,
      lines
    );

    // Our code is still correct, so the overall status stays PASS -- but the
    // divergence is stated in the verdict line, not buried.
    setVerdict(result.failures, result.checks + x.checked, verdictLine);
    document.body.setAttribute("data-webcrypto", "DIVERGES");
  });
})();
