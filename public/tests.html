    s.eq("Fermat holds for a random element", C.modPow(7n, C.p - 1n, C.p), 1n);

    // --- group laws ---
    s.checks++;
    if (!eq(C.add(B, P2), C.add(P2, B))) s.failures.push("addition is not commutative");
    s.checks++;
    if (!eq(C.add(C.add(B, P2), P3), C.add(B, C.add(P2, P3))))
      s.failures.push("addition is not associative");
    s.checks++;
    if (!eq(C.add(B, O), B)) s.failures.push("identity is not neutral");
    s.checks++;
    if (!eq(C.add(B, C.negate(B)), O)) s.failures.push("P + (-P) is not the identity");
    s.checks++;
    if (!eq(C.add(B, B), P2)) s.failures.push("P + P != [2]P");
    s.checks++;
    if (!eq(C.add(P2, P3), P5)) s.failures.push("[2]P + [3]P != [5]P");

    // --- the decisive one: base point order ---
    // [L]B must be the identity. If the curve constant d, the base point, or
    // the addition formula were wrong, this fails even when signatures verify.
    s.checks++;
    if (!eq(C.scalarMult(C.L, B), O))
      s.failures.push("[L]B is not the identity -- the group order is wrong");

    s.checks++;

      s.failures.push("[L+1]B != B");

    s.checks++;
    if (!eq(C.add(C.scalarMult(a, B), C.scalarMult(bb, B)), C.scalarMult(a + bb, B)))
      s.failures.push("[a]B + [b]B != [a+b]B");

    var k = 1n;
    for (var i = 0; i < 12; i++) {
      k = (k * 7919n + 13n) % C.L;
      var P = C.scalarMult(k, B);
      var back = C.decodePoint(C.encodePoint(P));
      s.checks++;
      if (back === null) {
        s.failures.push("encode/decode round-trip failed for k=" + k + " (decode returned null)");
      } else if (!eq(P, back)) {
        s.failures.push("encode/decode round-trip changed the point for k=" + k);
      }

    for (var j = 0; j < 32; j++) bad[j] = 0xff;   // y >= p, non-canonical
    s.checks++;
    if (C.decodePoint(bad) !== null)
      s.failures.push("decodePoint accepted a non-canonical y >= p");

    return s;
  }

  /* --- 6. Record verification and the outcome taxonomy ----------------- */

  function suiteRecord(data, RECORD) {
    var s = new Suite("Record outcomes");
    var O = RECORD.OUTCOME;

    for (var i = 0; i < data.recordCases.length; i++) {
      var c = data.recordCases[i];

        r = RECORD.verifyArtifact(c.artifact, c.public_key);
      } catch (e) {

        continue;

      s.eq(c.id + " (" + c.note + ")", r.outcome, c.expected_outcome);

      // record refused for its fields was still signed correctly, and the page
      // once said "Not confirmed for this record" about exactly that. Held to
      // Go's own signature verdict (core.VerifyRecordBytes) on every case.

           r.signatureValid === true, c.go_valid === true);

      //
      // go_valid is core.VerifyRecordBytes -- a SIGNATURE verdict and nothing
      // more. Our taxonomy is finer in both directions: UNKNOWN_KEY is Go's
      // false, and a valid signature over a document carrying an invented
      // top-level field is Go's true while being NOT_A_RECORD here (section 6
      // freezes the 33; Go draws the same line in ValidateArtifactBytes, which
      // this boolean does not run).
      //
      // So the assertion is the narrow true one: a valid signature must never be
      // reported as FAILS_VERIFICATION. Asserting VERIFIED here instead is what
      // let D1 through -- it encoded "Go says the bytes are signed" as "the page
      // must call it intact", which is precisely the conflation at issue.
      if (c.go_valid === true) {

        s.eq(c.id + " agrees with Go (invalid)", r.outcome, O.FAILS_VERIFICATION);
      }

        s.checks++;

          s.failures.push(c.id + ": VERIFIED without a recomputed record_hash");
        }
      }
    }

    // This page cannot read a manifest at runtime, so it carries its own copy;
    // that copy is only trustworthy while something compares it to the source of
    // truth. Sorted before comparing -- order is not part of the contract.
    var jsKeys = (RECORD.TOP_LEVEL_KEYS || []).slice().sort();
    var goKeys = (data.goTopLevelKeys || []).slice().sort();
    s.eq("frozen field list has 33 entries", String(jsKeys.length), "33");
    s.eq(
      "frozen field list matches Go's core.topLevelKeys",
      jsKeys.join(","),
      goKeys.join(",")
    );

    s.eq(
      "supported record versions match Go's",
      (RECORD.SUPPORTED_RECORD_VERSIONS || []).slice().sort().join(","),
      (data.goSupportedRecordVersions || []).slice().sort().join(",")
    );

    // The committed fixture, through the real path.
    var fx = RECORD.verifyArtifact(
      data.fixtureArtifact,
      data.fixturePublicKeyHex
    );
    s.eq("fixture verifies", fx.outcome, O.VERIFIED);
    s.eq(
      "fixture key fingerprint matches its signing_key_id (spec 4.5)",
      RECORD.keyFingerprint(data.fixturePublicKeyHex),
      fx.signingKeyId
    );

    // Garbage must never be reported as tampering. This is the first thing a
    // sceptical engineer tries, and crying tamper here would make the real
    // tamper demo look like theatre.
    var garbage = ["", "   ", "null", "42", '"a string"', "{", "{}", "[]", "<html>"];
    for (var g = 0; g < garbage.length; g++) {
      var gr = RECORD.verifyArtifact(garbage[g], data.fixturePublicKeyHex);
      s.checks++;
      if (gr.outcome !== O.NOT_A_RECORD) {
        s.failures.push(
          "garbage input " + JSON.stringify(garbage[g]) +
            " produced " + gr.outcome + ", must be NOT_A_RECORD"
        );
      }
    }

    return s;
  }

  /* --- 6b. Validation the differential cannot reach ---------------------- */

  // verifier/test/differential.mjs mutates one leaf of a record at a time, as
  // JSON values. These are the cases that cannot be written that way: how a
  // number was spelled, a date that is well formed and does not exist, an
  // order between two edges, and a key JavaScript treats specially. Each one is
  // a record verifycore accepts or refuses, and the page must say the same.
  function suiteValidation(data, RECORD, JCS, SHA3) {
    var s = new Suite("Validation edge cases");
    var base = data.invariantVectors.base;
    function copy() { return JSON.parse(JSON.stringify(base)); }
    function rebind(d) {
      d.causality_chain_hash = SHA3.sha3_256Hex(JCS.canonicalizeToBytes(JSON.stringify(d.provenance)));
      return d;
    }

      var r = RECORD.validateArtifact(text);
      return r.error || r.issues.join(" | ") || "ACCEPT";

    function rejects(label, text, path) {
      var v = verdict(text);
      if (v === "ACCEPT") s.fail(label + ": accepted, must be refused");
      else if (path && v.indexOf(path) === -1) s.fail(label + ": refused, but not for " + path + ": " + v);
      else s.ok();
    }

    accepts("the corpus base record", JSON.stringify(base));

    // An integer field spelled with a fraction or an exponent. JCS turns all of
    // them into 2, so the signature would verify, and verifycore cannot decode
    // the record at all.
    var text = JSON.stringify(base);
    s.eq("the base spells decisive_seq as 2", text.indexOf('"decisive_seq":2,') !== -1, true);
    ["2.0", "2e0", "2E0", "20e-1"].forEach(function (lit) {
      rejects("decisive_seq written " + lit, text.replace('"decisive_seq":2,', '"decisive_seq":' + lit + ","),
              "execution_context.decisive_seq");
    });

    cov.instrumentation_coverage = 1;
    accepts("instrumentation_coverage written 1.0",
            JSON.stringify(cov).replace('"instrumentation_coverage":1,', '"instrumentation_coverage":1.0,'));

    // Dates with the right shape that are not dates.

     ["1900-02-29T00:00:00Z", false], ["2026-04-31T00:00:00Z", false], ["2026-12-31T23:59:59Z", true],
     ["2026-01-01T23:59:60Z", false], ["2026-01-01T24:00:00Z", false],
     // RFC 3339 puts no limit on fraction digits
     ["2026-01-01T00:00:00.123456789012Z", true]].forEach(function (c) {
      var d = copy();
      d.created_at = c[0];
      if (c[1]) accepts("created_at " + c[0], JSON.stringify(d));
      else rejects("created_at " + c[0], JSON.stringify(d), "created_at");
    });

    // §4.3 order between two edges that share a record_hash, by selector. By
    // code point, U+E000 sorts before U+1F600. By UTF-16 code unit, which is
    // what JavaScript's < compares, U+1F600's high surrogate D83D sorts first.
    //
    // The edges are spliced in as JSON text. This file ships inside the page,
    // and the release preflight holds every edge-field access in the page to
    // edgeShapeIssues; it cannot tell a test writing an edge from code reading
    // one, so the test writes data rather than properties.
    function twoEdges(selA, selB) {
      var edges = [selA, selB].map(function (sel, i) {
        return { record_id: i ? "66666666-7777-4888-9999-aaaaaaaaaaaa" : "11111111-2222-4333-8444-555555555555",
                 record_hash: "a".repeat(64), relationship: "DERIVED_FROM",
                 consumed_output_selector: sel, consumed_output_hash: (i ? "e" : "d").repeat(64),
                 parent_signing_key_id: "c".repeat(64) };
      });
      var d = copy();
      var prov = JSON.stringify(d.provenance);
      s.eq("the base provenance has an empty upstream to splice into", prov.indexOf('"upstream":[]') !== -1, true);
      d.provenance = JSON.parse(prov.replace('"upstream":[]', '"upstream":' + JSON.stringify(edges)));
      return JSON.stringify(rebind(d));
    }
    accepts("edges ordered by code point", twoEdges("/", "/😀"));
    rejects("edges ordered by UTF-16 code unit", twoEdges("/😀", "/"), "not sorted");
    accepts("a selector that is a prefix of the next sorts first", twoEdges("/a", "/ab"));
    // The tuple order, not the three joined with a separator: verifycore once
    // joined them with 0x1F and refused this sorted record.
    accepts("a selector holding a byte below 0x1F sorts after its prefix", twoEdges("/a", "/a\u0001"));
    rejects("selector \"/\", whose empty segment names no field", twoEdges("/", "/a"), "consumed_output_selector");

    // §6: an envelope may carry a key this verifier does not know, and that
    // key is hashed by I3 like any other. "__proto__" is one a plain
    // JavaScript object silently turns into its prototype.
    var p = copy();
    p.provenance = JSON.parse('{"__proto__":{"x":1}}');
    Object.keys(base.provenance).forEach(function (k) { p.provenance[k] = base.provenance[k]; });
    var ptext = JSON.stringify(rebind(p));
    s.eq("the __proto__ key is in the record", ptext.indexOf('"__proto__":{"x":1}') !== -1, true);
    accepts("an envelope key named __proto__", ptext);

    return s;
  }

  /* --- 6c. The cross-language invariant corpus --------------------------- */

  // testdata/invariant_vectors.json, the corpus verifycore's own test runs
  // (verifycore/invariant_vectors_test.go), derived from the specification
  // rather than from either implementation. Running it here, in the shipped
  // page, is what lets a reader see the page pass the same cases the CLI's
  // code is tested against, rather than take our word for it.
  //
  // This harness mirrors the Go one rule for rule: mutations by dotted path,
  // where an integer segment indexes an array; `set` or `delete`; and a
  // rejection counts only if it names the field the case says it must. One
  // copy, used by this suite and by test/invariant-corpus.mjs, so the reporter
  // and the gate cannot read the corpus differently.
  function applyMutation(doc, path, value, del) {
    var segs = path.split(".");
    var cur = doc;
    for (var i = 0; i < segs.length; i++) {
      var last = i === segs.length - 1;
      var seg = segs[i];
      if (Array.isArray(cur)) {
        if (!/^-?\d+$/.test(seg)) throw new Error("segment " + seg + " is not an array index");
        seg = Number(seg);
        if (seg < 0 || seg >= cur.length) throw new Error("index " + seg + " out of range at " + path);
        if (last) {
          if (del) throw new Error("delete from an array is not supported (" + path + ")");
          cur[seg] = value;
          return;
        }
      } else if (cur && typeof cur === "object") {
        if (last) {
          if (del) delete cur[seg];
          else cur[seg] = value;
          return;
        }
        if (!Object.prototype.hasOwnProperty.call(cur, seg))
          throw new Error("no key " + seg + " at " + segs.slice(0, i + 1).join("."));
      } else {
        throw new Error("cannot descend into " + typeof cur + " at " + seg);
      }
      cur = cur[seg];
    }
  }

  // "a.b[1].c" and "a.b.1.c" reduce to the same stem.
  function normalisePath(p) { return p.replace(/\[/g, ".").replace(/\]/g, ""); }

  function runCorpus(corpus, RECORD) {
    var results = [];
    corpus.cases.forEach(function (c) {
      if (c.known_divergence) { results.push({ c: c, status: "skip", why: c.known_divergence }); return; }
      var doc = JSON.parse(JSON.stringify(corpus.base));
      try {
        c.mutations.forEach(function (m) { applyMutation(doc, m.path, m.set, !!m["delete"]); });
      } catch (e) {
        results.push({ c: c, status: "fail", why: "harness: " + e.message });
        return;
      }
      var r = RECORD.validateArtifact(JSON.stringify(doc));
      var rejected = !!r.error || r.issues.length > 0;
      var said = [r.error].concat(r.issues).filter(Boolean).join(" | ");
      if (c.expect === "accept") {
        results.push(rejected ? { c: c, status: "fail", why: "expected ACCEPT, rejected: " + said }
                              : { c: c, status: "pass" });
      } else if (!rejected) {
        results.push({ c: c, status: "fail", why: "expected REJECT, accepted" });
      } else if (c.expect_path && normalisePath(said).indexOf(normalisePath(c.expect_path)) === -1) {
        results.push({ c: c, status: "fail", why: "rejected, but not for " + c.expect_path + ": " + said });
      } else {
        results.push({ c: c, status: "pass" });
      }
    });
    return results;
  }

  function suiteCorpus(data, RECORD) {
    var s = new Suite("Invariant corpus, as Go");
    runCorpus(data.invariantVectors, RECORD).forEach(function (r) {
      if (r.status === "pass") s.ok();
      else s.fail(r.c.id + " [" + r.c.invariant + "]: " + r.why);
    });
    return s;
  }

  /* --- 7. Field-level diff for the tamper demo --------------------------- */

  function suiteDiff(data, RECORD) {
    var s = new Suite("Tamper diff");

    // A key named "__proto__" inside an envelope is a key like any other (§6),
    // and a change to it must be named. Found by the v1.2.0 page review: the
    // diff recorded keys on a plain {}, where that one silently vanished.
    var protoA = '{"provenance":{"__proto__":{"x":1},"schema_version":"1.0.0"}}';
    var protoB = '{"provenance":{"__proto__":{"x":2},"schema_version":"1.0.0"}}';
    var protoDiff = RECORD.diffFields(protoA, protoB) || [];
    s.eq("a change under a __proto__ envelope key is named",
         protoDiff.length === 1 && protoDiff[0].path.indexOf("__proto__") !== -1, true);

    var original = data.fixtureArtifact;

    function editedWith(mutate) {
      var doc = global.PlainRealJCS.readObject(original).plain();
      mutate(doc);
      return JSON.stringify(doc);
    }

    var d1 = RECORD.diffFields(
      original,
      editedWith(function (d) { d.action_type = "changed_value"; })
    );
    s.eq("top-level change count", d1.length, 1);
    s.eq("top-level change path", d1[0].path, "action_type");

    var d2 = RECORD.diffFields(
      original,
      editedWith(function (d) { d.governance_context.retention_class = "DEV_EPHEMERAL"; })
    );
    s.eq("nested change count", d2.length, 1);
    s.eq("nested change path", d2[0].path, "governance_context.retention_class");

    var d3 = RECORD.diffFields(
      original,
      editedWith(function (d) { delete d.capture_layer; })
    );
    s.eq("removal detected", d3.length, 1);
    s.eq("removal kind", d3[0].kind, "removed");

    var d4 = RECORD.diffFields(original, original);
    s.eq("identical documents produce no diff", d4.length, 0);

    // Naming the field requires a pristine original. For pasted JSON there
    // isn't one, and the honest answer is "cannot say which field" rather than
    // a guess -- a hash gives up no structure.
    s.eq("no diff without an original", RECORD.diffFields(null, original), null);

    return s;
  }

  /* --- Runner ------------------------------------------------------------ */

  /*
   * Public-key parsing. Every case here is one a reader can actually hit by
   * pasting the wrong thing, and each must be REJECTED WITH A REASON rather
   * than silently producing 32 bytes that verify nothing. A key parser that
   * fails quietly turns every subsequent record into DIFFERENT SIGNING KEY
   * and hides the real mistake from the person who made it.
   */
  function suitePublicKey(data, RECORD) {
    var s = new Suite("Public key parsing");
    var P = RECORD.parsePublicKey;

    if (data.fixturePublicKeyPEM && data.fixturePublicKeyHex) {
      var r = P(data.fixturePublicKeyPEM);
      s.eq("demo key PEM parses", r.ok, true);
      s.eq("demo key PEM yields the embedded hex", r.hex, data.fixturePublicKeyHex);
      s.eq("raw hex accepted", P(data.fixturePublicKeyHex).hex, data.fixturePublicKeyHex);
      s.eq("uppercase hex normalised",
           P(data.fixturePublicKeyHex.toUpperCase()).hex, data.fixturePublicKeyHex);
      s.eq("surrounding whitespace tolerated",
           P("\n  " + data.fixturePublicKeyHex + "  \n").hex, data.fixturePublicKeyHex);
      s.eq("PEM with trailing newlines tolerated",
           P(data.fixturePublicKeyPEM + "\n\n").hex, data.fixturePublicKeyHex);
    }

    s.eq("empty input is not ok", P("").ok, false);
    s.eq("empty input is flagged empty", P("   ").empty, true);
    s.eq("garbage rejected", P("hello there").ok, false);
    s.eq("63 hex chars rejected", P(new Array(64).join("a")).ok, false);
    s.eq("65 hex chars rejected", P(new Array(66).join("a")).ok, false);
    s.eq("128 hex chars rejected (a signature, not a key)",
         P(new Array(129).join("a")).ok, false);

    var priv = P("-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIA==\n-----END PRIVATE KEY-----");
    s.eq("private key rejected", priv.ok, false);
    s.ok("private key reason warns the reader", /PRIVATE key/.test(priv.reason || ""));

    // Well-formed PEM carrying a NON-Ed25519 key. Without the OID check this
    // would yield 32 bytes sliced out of a P-256 point and look like a key.
    var p256 = "-----BEGIN PUBLIC KEY-----\n" +
      "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE" + new Array(53).join("A") + "\n" +
      "-----END PUBLIC KEY-----";
    var wrongCurve = P(p256);
    s.eq("non-Ed25519 PEM rejected", wrongCurve.ok, false);
    s.ok("non-Ed25519 reason names the algorithm",
         /Ed25519|other type/.test(wrongCurve.reason || ""));

    // Strict base64, since this file decodes it rather than calling atob.
    function pem(bodyB64) {
      return "-----BEGIN PUBLIC KEY-----\n" + bodyB64 + "\n-----END PUBLIC KEY-----";
    }
    s.eq("bad base64 rejected", P(pem("!!!!")).ok, false);
    s.eq("length not a multiple of 4 rejected", P(pem("MCowBQYDK2VwAyEA")).ok !== true, true);
    s.eq("padding in the middle rejected", P(pem("MCow=QYDK2VwAyEA")).ok, false);
    s.eq("character after padding rejected", P(pem("MCowBQYDK2Vw=yEA")).ok, false);
    s.eq("padding in the first two slots rejected", P(pem("==owBQYDK2VwAyEA")).ok, false);

    var bad = ["hello", new Array(64).join("a"), p256,
               "-----BEGIN PUBLIC KEY-----\n!!!!\n-----END PUBLIC KEY-----"];
    for (var i = 0; i < bad.length; i++) {
      var res = P(bad[i]);
      s.ok("rejection " + i + " explains itself",
           typeof res.reason === "string" && res.reason.length > 20);
    }
    return s;
  }

  function runAll(data, env) {
    var suites = [
      suiteJCSVectors(data, env.JCS, env.SHA3),
      suiteDifferential(data, env.JCS),
      suiteSHA3(data, env.SHA3),
      suiteSHA512(data, env.SHA512),
      suiteEd25519(data, env.ED),
      suiteCurve(data, env.ED),
      suiteRecord(data, env.RECORD),
      suiteValidation(data, env.RECORD, env.JCS, env.SHA3),
      suiteCorpus(data, env.RECORD),
      suiteDiff(data, env.RECORD),
      suitePublicKey(data, env.RECORD),
    ];
    var checks = 0, failures = 0;
    for (var i = 0; i < suites.length; i++) {
      checks += suites[i].checks;
      failures += suites[i].failures.length;
    }
    return { suites: suites, checks: checks, failures: failures };
  }

  /*
   * Optional cross-check against WebCrypto's Ed25519, where the browser has it.
   *
   * This is a TEST oracle only -- WebCrypto is deliberately not a shipped code
   * path (see ed25519.js). The value is an independent implementation checking
   * ours at runtime; the cost is nothing, because nothing here ships.
   *
   * Returns a promise. A browser without Ed25519 support reports "unavailable",
   * which is not a failure -- the vendored path is the one that matters.
   */
  function crossCheckWebCrypto(data, ED) {
    var subtle =
      global.crypto && global.crypto.subtle ? global.crypto.subtle : null;
    if (!subtle) {
      return Promise.resolve({ available: false, reason: "no crypto.subtle" });
    }

    var cases = data.ed25519Cases;
    return subtle
      .importKey("raw", hexToBytes(cases[0].public_key), { name: "Ed25519" }, false, ["verify"])
      .then(function () {
        var checked = 0, disagreements = [];
        var chain = Promise.resolve();
        cases.forEach(function (c) {
          chain = chain.then(function () {
            return subtle
              .importKey("raw", hexToBytes(c.public_key), { name: "Ed25519" }, false, ["verify"])
              .then(function (key) {
                return subtle.verify(
                  { name: "Ed25519" },
                  key,
                  hexToBytes(c.signature),
                  hexToBytes(c.message)
                );
              })
              .then(function (webResult) {
                checked++;
                var ours = ED.verify(
                  hexToBytes(c.public_key),
                  hexToBytes(c.message),
                  hexToBytes(c.signature)
                );
                if (webResult !== ours) {
                  disagreements.push({
                    id: c.id,
                    note: c.note,
                    webcrypto: webResult,
                    vendored: ours,
                    go: c.valid,
                    messageBytes: c.message.length / 2,
                  });
                }
              })
              .catch(function () {
                // A key WebCrypto refuses to import is a rejection on its side;
                // agreement means ours must also reject.
                checked++;
                var ours = ED.verify(
                  hexToBytes(c.public_key),
                  hexToBytes(c.message),
                  hexToBytes(c.signature)
                );
                if (ours !== false) {
                  disagreements.push({
                    id: c.id,
                    note: c.note,
                    webcrypto: "refused the input",
                    vendored: ours,
                    go: c.valid,
                    messageBytes: c.message.length / 2,
                  });
                }
              });
          });
        });
        return chain.then(function () {
          return { available: true, checked: checked, disagreements: disagreements };
        });
      })
      .catch(function (e) {
        return {
          available: false,
          reason: "Ed25519 not supported by this browser's WebCrypto",
        };
      });
  }

  global.PlainRealSuites = {
    runAll: runAll,
    runCorpus: runCorpus,
    crossCheckWebCrypto: crossCheckWebCrypto,
    hexToBytes: hexToBytes,
    bytesToHex: bytesToHex,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);

    verdictEl.textContent = "FAIL — suite threw: " + e.message;
    document.body.setAttribute("data-status", "FAIL");
    return;
  }

  function renderSuite(name, checks, failures) {
    var row = document.createElement("div");
    row.className = "suite" + (failures.length ? " bad" : "");
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = (failures.length ? "FAIL  " : "PASS  ") + name;
    var c = document.createElement("span");
    c.className = "c";
    c.textContent = (checks - failures.length) + "/" + checks;
    row.appendChild(n);
    row.appendChild(c);
    suitesEl.appendChild(row);

    if (failures.length) {
      var pre = document.createElement("pre");
      // textContent, never innerHTML: failure strings contain test input.
      pre.textContent = failures.join("\n\n");
      failuresEl.appendChild(pre);
    }
  }

  for (var i = 0; i < result.suites.length; i++) {
    renderSuite(result.suites[i].name, result.suites[i].checks, result.suites[i].failures);
  }

  function setVerdict(failures, checks, extra) {
    var pass = failures === 0;
    verdictEl.className = pass ? "pass" : "fail";
    verdictEl.textContent =
      (pass ? "ALL PASS" : "FAILURES") +
      " — " + (checks - failures) + "/" + checks + " checks" +
      (extra ? "  |  " + extra : "");
    // Machine-readable for headless runs.
    document.body.setAttribute("data-status", pass ? "PASS" : "FAIL");
    document.title =
      (pass ? "PASS" : "FAIL") + " " + (checks - failures) + "/" + checks;
  }

  setVerdict(result.failures, result.checks, "webcrypto cross-check running…");

  /* WebCrypto is a TEST oracle only -- never a shipped code path.
   *
   * The gate is "vendored agrees with Go". That is decided by the Ed25519
   * suite above. When THAT suite passes and WebCrypto still disagrees, the
   * browser is the outlier against two independent implementations, and the
   * honest report is a browser defect -- not a failure of this code.
   *
   * Recording it as a build failure would mean a browser bug could pressure us
   * into "fixing" correct cryptography to match it. Silencing it would throw
   * away a real signal. So: surfaced loudly, scored separately. */
  var edSuite = null;
  for (var q = 0; q < result.suites.length; q++) {
    if (result.suites[q].name === "Ed25519 vs Go oracle") edSuite = result.suites[q];
  }
  var vendoredMatchesGo = edSuite && edSuite.failures.length === 0;

  PlainRealSuites.crossCheckWebCrypto(TEST_DATA, PlainRealEd25519).then(function (x) {
    if (!x.available) {
      renderSuite("WebCrypto cross-check — unavailable", 0, []);
      setVerdict(result.failures, result.checks,
        "no WebCrypto Ed25519 (" + x.reason + ") — vendored path is authoritative");
      return;
    }

    if (x.disagreements.length === 0) {
      renderSuite("WebCrypto cross-check", x.checked, []);
      setVerdict(result.failures, result.checks + x.checked,
        "WebCrypto agreed on all " + x.checked + " cases");
      return;
    }

    // Derive the shape of the divergence from the data rather than asserting
    // it: if every disagreeing case shares a message length, say so.
    var lengths = {}, allAgreeWithGo = true, lines = [];
    for (var i = 0; i < x.disagreements.length; i++) {
      var dis = x.disagreements[i];
      lengths[dis.messageBytes] = (lengths[dis.messageBytes] || 0) + 1;
      if (dis.vendored !== dis.go) allAgreeWithGo = false;
      lines.push(
        dis.id + " (" + dis.note + ")\n" +
        "    message length: " + dis.messageBytes + " bytes\n" +
        "    go: " + dis.go + "   vendored: " + dis.vendored +
        "   this browser's WebCrypto: " + dis.webcrypto
      );
    }
    var lens = Object.keys(lengths);
    var shape = lens.length === 1
      ? "every disagreeing case has a message of exactly " + lens[0] + " bytes"
      : "message lengths involved: " + lens.join(", ");

    var verdictLine;
    if (vendoredMatchesGo && allAgreeWithGo) {
      verdictLine =
        "BROWSER DEFECT — this browser's WebCrypto disagrees with BOTH Go and the " +
        "vendored implementation on " + x.disagreements.length + " of " + x.checked +
        " cases. " + shape + ". The vendored path is correct; this is why it ships " +
        "instead of WebCrypto.";
    } else {
      verdictLine =
        "WebCrypto disagrees on " + x.disagreements.length + " cases AND the vendored " +
        "path does not match Go — investigate the vendored code first.";
    }

    renderSuite(
      "WebCrypto cross-check — " +
        (vendoredMatchesGo && allAgreeWithGo ? "BROWSER DIVERGES" : "FAIL"),
      x.checked,
      lines
    );

    // Our code is still correct, so the overall status stays PASS -- but the
    // divergence is stated in the verdict line, not buried.
    setVerdict(result.failures, result.checks + x.checked, verdictLine);
    document.body.setAttribute("data-webcrypto", "DIVERGES");
  });
})();
</script>
</body>
</html>
